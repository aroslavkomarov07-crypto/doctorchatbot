name: doctorchatbot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctorchatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-doctorchatbot}
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doctorchatbot}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doctorchatbot}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-platega}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_API_KEY: ${PLATEGA_API_KEY:-}
      PLATEGA_SBP_PAYMENT_METHOD: ${PLATEGA_SBP_PAYMENT_METHOD:-}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      MOCK_SECRET: ${MOCK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-doctorchatbot}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      SQL_ECHO: ${SQL_ECHO:-false}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?Set OWNER_TELEGRAM_ID in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-platega}
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_API_KEY: ${PLATEGA_API_KEY:-}
      PLATEGA_SBP_PAYMENT_METHOD: ${PLATEGA_SBP_PAYMENT_METHOD:-}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      MOCK_SECRET: ${MOCK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  postgres_data:
